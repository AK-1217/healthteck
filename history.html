<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View your Healthtech medicine search history with the date & time of each search." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E" />
    <title>My History | Healthtech</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div id="main-content" class="main-content">
        <section class="page-banner">
            <div class="wrap">
                <h1>Search History</h1>
                <p class="breadcrumb"><a href="index.html">Home</a> / History</p>
            </div>
        </section>

        <section class="wrap content-row">
            <div class="content-main">
                <h2>Your medicine searches</h2>
                <p id="historyIntro">Your recent medicine searches will appear here with the date &amp; time.</p>

                <div style="margin:18px 0; text-align:right;">
                    <button type="button" id="clearHistoryBtn" class="btn-secondary" style="border-color:#c0392b; color:#c0392b;">🗑️ Clear History</button>
                </div>

                <div id="historyList"></div>
            </div>
            <aside class="sidebar">
                <div class="side-box">
                    <h3>Account</h3>
                    <ul>
                        <li><a href="profile.html">👤 My Profile</a></li>
                        <li><a href="bookmarks.html">⭐ My Bookmarks</a></li>
                        <li><a href="history.html">🕘 My History</a></li>
                        <li class="auth-guest-only"><a href="login.html">🔐 Login</a></li>
                        <li class="auth-guest-only"><a href="register.html">📝 Register</a></li>
                    </ul>
                </div>
            </aside>
        </section>
    </div>

    <script src="common.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const user = (window.HealthtechAuth && window.HealthtechAuth.getCurrentUser()) || null;
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const HISTORY_KEY = "healthtech_search_history";
            const listEl = document.getElementById("historyList");
            const introEl = document.getElementById("historyIntro");
            const clearBtn = document.getElementById("clearHistoryBtn");

            function loadHistory() {
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            }

            function render() {
                const history = (loadHistory() || []).filter((h) => h && h.query);
                if (!history.length) {
                    listEl.innerHTML = '<div class="empty-state"><p>🗒️ No search history yet.</p><p class="hint">Search for a medicine on the home page to see it here with its date &amp; time.</p></div>';
                    clearBtn.style.display = "none";
                    return;
                }
                clearBtn.style.display = "inline-block";
                if (introEl) introEl.textContent = "Showing the last " + history.length + " medicine search(es) for " + user.name + ".";

                let html = "";
                history.forEach(function (entry, idx) {
                    const medicines = (entry.medicines && entry.medicines.length)
                        ? entry.medicines.join(", ")
                        : "";
                    html += '<div class="item-card">' +
                        '<h4>🔍 ' + entry.query + '</h4>' +
                        '<div class="meta" style="margin-top:6px;">' +
                        '<span><strong>Date:</strong> ' + entry.date + '</span>' +
                        '<span><strong>Time:</strong> ' + entry.time + '</span>' +
                        '</div>' +
                        (medicines ? '<p class="desc" style="margin-top:8px;"><strong>Matches:</strong> ' + medicines + '</p>' : '') +
                        '</div>';
                });
                listEl.innerHTML = html;

                // Reveal-on-scroll should show dynamically added cards immediately
                listEl.querySelectorAll(".item-card").forEach(function (c) { c.classList.add("revealed"); });
            }

            clearBtn.addEventListener("click", function () {
                if (window.confirm("Clear all of your search history?")) {
                    localStorage.removeItem(HISTORY_KEY);
                    render();
                }
            });

            render();
        });
    </script>
</body>
</html>
